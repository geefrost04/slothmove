    "ก.พ.ร. ประธาน = <strong>นายกรัฐมนตรีหรือรองนายกฯ</strong> | รองประธาน = ปลัดกระทรวง | เลขา = เลขาฯ สปน.",
    "จังหวัด = นิติบุคคล ตั้ง/ยุบ/เปลี่ยนเขต → พ.ร.บ. | อำเภอ = ไม่เป็นนิติบุคคล ตั้ง/ยุบ/เปลี่ยนเขต → พ.ร.ฎ."
  ]
};

var chapterColors = ['#4f46e5','#7c3aed','#0891b2','#059669','#d97706','#db2777','#0d9488','#c026d3'];

function highlightKeywords(text) {
  var rules = [
    { regex: /(ห้าม|ต้องห้าม|ไม่ให้|เด็ดขาด)/g, cls: 'kw-forbidden' },
    { regex: /(โทษปรับ|ปรับ|จำคุก|ลงโทษ|กระทำความผิด)/g, cls: 'kw-penalty' },
    { regex: /(ต้อง|บังคับ|จำเป็นต้อง|มีหน้าที่ต้อง)/g, cls: 'kw-required' },
    { regex: /(ยกเว้น|ได้รับยกเว้น|ไม่ต้อง|กรณีพิเศษ)/g, cls: 'kw-except' },
    { regex: /(ระวัง|ควรระวัง|อันตราย|เสี่ยง|สำคัญ)/g, cls: 'kw-warning' },
    { regex: /(\d+\s*วัน|\d+\s*ปี|ภายใน\s*\d+|กำหนดเวลา|ครบกำหนด)/g, cls: 'kw-time' },
    { regex: /(\d+\s*บาท|เงิน\d+|ค่าปรับ\d+)/g, cls: 'kw-money' },
    { regex: /(เด็ดขาด|สำคัญมาก|จำเป็นต้องรู้|ข้อสอบบ่อย)/g, cls: 'kw-important' }
  ];
  rules.forEach(function(rule) {
    text = text.replace(rule.regex, function(match) {
      return '<span class="' + rule.cls + '">' + match + '</span>';
    });
  });
  return text;
}

function renderContentS1(data) {
  var accList = document.getElementById('accordionList');
  if (!accList) return;
  var html = '';
  data.chapters.forEach(function(ch, i) {
    var color = chapterColors[i % chapterColors.length];
    html += '<div class="chapter-acc" id="acc' + i + '">';
    html += '<div class="chapter-acc-header" onclick="toggleAcc(' + i + ')">';
    html += '<div class="chapter-acc-num" style="background:var(--ddpm-navy);color:var(--ddpm-yellow)">' + ch.num + '</div>';
    html += '<span class="chapter-acc-emoji">' + ch.emoji + '</span>';
    html += '<span class="chapter-acc-title">' + ch.title + '</span>';
    html += '<svg class="chapter-acc-arrow" id="arr' + i + '" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M19 9l-7 7-7-7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"/></svg>';
    html += '</div>';
    html += '<div class="chapter-acc-body" id="body' + i + '"><div class="acc-body-inner">';
    ch.body.forEach(function(item) {
      html += '<div class="ch-item-wrap">';
      if (item.type === 'p') {
        html += '<p class="ch-p">' + highlightKeywords(item.text) + '</p>';
      } else if (item.type === 'heading') {
        html += '<p class="ch-subheading">' + highlightKeywords(item.text) + '</p>';
      } else if (item.type === 'list') {
        html += '<ul class="ch-list">';
        item.items.forEach(function(it) { html += '<li>' + highlightKeywords(it) + '</li>'; });
        html += '</ul>';
      } else if (item.type === 'table') {
        html += '<table class="ch-table">';
        item.rows.forEach(function(row) { html += '<tr><td>' + row[0] + '</td><td>' + row[1] + '</td></tr>'; });
        html += '</table>';
      } else if (item.type === 'box') {
        var colorClass = item.color || 'purple';
        html += '<div class="ch-box ch-box-' + colorClass + '">';
        html += '<div class="ch-box-title ' + colorClass + '">' + item.title + '</div><ul>';
        item.items.forEach(function(it) { html += '<li>' + highlightKeywords(it) + '</li>'; });
        html += '</ul></div>';
      } else if (item.type === 'keypoint') {
        html += '<div class="key-point"><div class="key-point-title">' + item.title + '</div><div class="key-point-text">' + highlightKeywords(item.text) + '</div></div>';
      }
      html += '</div>';
    });
    html += '</div></div></div>';
  });
  accList.innerHTML = html;
}

// Auto init
document.addEventListener('DOMContentLoaded', function() {
  renderContentS1(CONTENT);
});
</script>
